<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error {{ code }} — HCLV SMS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--light)}</style>
</head>
<body>
  <div class="card text-center" style="max-width:420px;padding:40px">
    <div style="font-size:3rem;margin-bottom:12px">{% if code==404 %}🔍{% elif code==403 %}🚫{% else %}⚠️{% endif %}</div>
    <h2 style="color:var(--navy);margin:0 0 8px">Error {{ code }}</h2>
    <p class="text-muted">{{ message }}</p>
    <a href="/" class="btn btn-primary" style="margin-top:8px">← Go Home</a>
  </div>
</body>
</html>
