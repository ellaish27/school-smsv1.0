{% extends "base.html" %}
{% block title %}No Profile{% endblock %}
{% block page_title %}Student Profile Missing{% endblock %}

{% block content %}
<div class="card" style="max-width:500px;margin:40px auto;text-align:center">
  <div class="card-body" style="padding:48px">
    <div style="font-size:3rem">⚠️</div>
    <h3 style="color:var(--navy);margin:16px 0 8px">Profile Not Found</h3>
    <p class="text-muted">Your student profile has not been set up yet. Please contact the school administration.</p>
    <a href="{{ url_for('profile') }}" class="btn btn-primary">Go to Profile</a>
  </div>
</div>
{% endblock %}
